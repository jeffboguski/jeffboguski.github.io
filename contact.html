    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f5;
            color: #222;
            line-height: 1.65;
        }

        .inner {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: #171717;
            color: white;
            padding: 45px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 8px 0 0;
            color: #ccc;
            font-size: 17px;
        }

        nav {
            background: white;
            border-bottom: 1px solid #ddd;
        }

        nav .inner {
            padding: 15px 20px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: #333;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 50px 20px 70px;
        }

        section {
            max-width: 760px;
        }

        h2 {
            font-size: 25px;
            font-weight: 500;
            margin: 0 0 18px;
        }

        p {
            margin: 0 0 18px;
        }

        form {
            margin-top: 35px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 15px;
            font-weight: 500;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 22px;
            border: 1px solid #bbb;
            background: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #555;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            padding: 10px 18px;
            border: 1px solid #555;
            background: transparent;
            color: #222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #222;
            color: white;
        }

        footer {
            background: white;
            border-top: 1px solid #ddd;
            padding: 25px 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {

            header {
                padding: 40px 20px 35px;
            }

            header h1 {
                font-size: 34px;
            }

            nav .inner {
                gap: 18px;
            }

            main {
                padding-top: 40px;

<body>

<header>
    <div class="inner">
        <h1>Contact</h1>
        <p>Live Entertainment · Touring · Production</p>
    </div>
</header>


<nav>
    <div class="inner">
        <a href="index.html">Home</a>
        <a href="career.html">Career</a>
        <a href="selected-work.html">Selected Work</a>
        <a href="selected-credits.html">Selected Credits</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>


<main>

    <section>

        <h2>Get in Touch</h2>

        <p>
            For professional inquiries regarding touring, production management,
            consulting or other live entertainment work, you can send a message
            using the form below.
        </p>


        <form action="YOUR_FORMSPREE_ENDPOINT" method="POST">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >


            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                name="subject"
                required
            >


            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                required
            ></textarea>


            <button type="submit">Send Message</button>

        </form>

    </section>

</main>


<footer>
    <div class="inner">
        © 2026 Jeff Boguski
    </div>
</footer>
